services:
  - type: web
    name: quaeryx-api
    runtime: python
    rootDir: apps/api
    buildCommand: pip install --upgrade pip && pip install --prefer-binary -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PYTHONPATH
        value: "/opt/render/project/src"
      - key: GROQ_API_KEY
        value: "sk_T8G1Nbiv44HnzNs2FcE4WGdyb3FYwWrezvpvDESKrvgyfML2cRRP"
      - key: BRAVE_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: EXA_API_KEY
        sync: false
